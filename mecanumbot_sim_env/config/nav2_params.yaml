# Nav2 Humble configuration for the simulated Mecanumbot.
#
# Based on Fortuz/mecanumbot mecanumbot_custom_nav2_no_keepout.yaml
# (commit 5818369, Apache 2.0). Footprint, inflation, controller and AMCL values
# are the real robot's. Differences from that file are listed in
# docs/phase2-nav2-config.md. use_sim_time is rewritten by the launch files.

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "mecanumbot/base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: true
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 800
    odom_frame_id: "mecanumbot/odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: /mecanumbot/scan

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""  # set by the launch file

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: mecanumbot/base_link
    odom_topic: /mecanumbot/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Both are replaced by the launch file with the trees in behavior_trees/.
    # The planner used by NavigateToPose is chosen by which tree the goal names.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

controller_server:
  ros__parameters:
    use_sim_time: False
    odom_topic: /mecanumbot/odom
    controller_frequency: 6.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.10
      required_movement_angle: 0.4
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.3

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"

      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      angular_disengage_threshold: 0.3925
      rotate_to_heading_angular_vel: 0.7
      max_angular_accel: 0.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      closed_loop: true

      # Holonomic DWB: the robot samples sideways velocities too.
      debug_trajectory_details: false
      min_vel_x: -0.24
      min_vel_y: -0.24
      max_vel_x: 0.24
      max_vel_y: 0.24
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.24
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 2.0
      acc_lim_theta: 2.0
      decel_lim_x: -2.0
      decel_lim_y: -2.0
      decel_lim_theta: -2.0
      vx_samples: 13
      vy_samples: 9
      vtheta_samples: 13
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.30
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "Twirling", "PreferForward"]
      ObstacleFootprint.scale: 0.5
      PathAlign.scale: 0.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 0.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      Twirling.scale: 1.0
      Oscillation.scale: 20.0
      Oscillation.oscillation_reset_dist: 0.5
      Oscillation.oscillation_reset_angle: 1.0
      Oscillation.oscillation_reset_time: -1.0
      RotateToGoal.scale: 30.0
      RotateToGoal.slowing_factor: 2.0
      RotateToGoal.lookahead_time: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: mecanumbot/odom
      robot_base_frame: mecanumbot/base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.2875, 0.08], [0.2875, -0.08], [0.05, -0.153], [-0.1405, -0.153], [-0.1405, 0.153], [0.05, 0.153]]"
      footprint_padding: 0.01
      plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 2
        group_connectivity_type: 8
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.66
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /mecanumbot/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: mecanumbot/base_link
      footprint: "[[0.2875, 0.08], [0.2875, -0.08], [0.05, -0.153], [-0.1405, -0.153], [-0.1405, 0.153], [0.05, 0.153]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /mecanumbot/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: True
        minimal_group_size: 2
        group_connectivity_type: 8
      # The safest/combined planners read this cost gradient as "closeness to
      # obstacles", so keep a radius well beyond the inscribed radius.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.66
      always_send_full_costmap: True

# One planner instance per criterion, so the criterion can be picked per request
# (ComputePathToPose.planner_id, or the matching behavior tree for NavigateToPose)
# without reconfiguring anything. NavFn is the stock baseline for comparison.
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["Shortest", "Safest", "Smoothest", "Combined", "NavFn"]
    Shortest:
      plugin: "mecanumbot_path_planner/AStarPlanner"
      optimization_mode: "shortest"
      allow_unknown: false
    Safest:
      plugin: "mecanumbot_path_planner/AStarPlanner"
      optimization_mode: "safest"
      allow_unknown: false
      safety_preference: 1.0
    Smoothest:
      plugin: "mecanumbot_path_planner/AStarPlanner"
      optimization_mode: "smoothest"
      allow_unknown: false
      smoothness_preference: 1.0
    Combined:
      plugin: "mecanumbot_path_planner/AStarPlanner"
      optimization_mode: "combined"
      allow_unknown: false
      safety_preference: 1.0
      smoothness_preference: 1.0
    NavFn:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: mecanumbot/odom
    robot_base_frame: mecanumbot/base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.5, 0.7]
    min_velocity: [-0.5, -0.5, -0.7]
    max_accel: [2.0, 2.0, 1.0]
    max_decel: [-2.0, -2.0, -1.0]
    odom_topic: "/mecanumbot/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "mecanumbot/base_footprint"
    odom_frame_id: "mecanumbot/odom"
    cmd_vel_in_topic: "/mecanumbot/cmd_vel_smoothed"
    cmd_vel_out_topic: "/mecanumbot/cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/mecanumbot/scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
